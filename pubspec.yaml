name: smart_routine_ai
description: "An AI-powered daily routine planner with offline capabilities."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_tts: ^4.2.5
  alarm: ^5.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_generative_ai: ^0.4.7
  intl: ^0.20.2
  permission_handler: ^12.0.1
  tflite_flutter: ^0.12.1
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1
  speech_to_text: ^7.3.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0 
  path_provider: ^2.1.5 
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  internet_connection_checker: ^3.0.1
  device_calendar: ^4.3.3
  sensors_plus: ^7.0.0
  audioplayers: ^6.6.0
  flutter_native_splash: ^2.4.7
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # It tells Flutter to bundle these specific files into the final app.
  assets:
    - .env
    - assets/alarm.wav
    - assets/alarm2.wav 
    - assets/audio/
    - assets/routine_predictor.tflite
    - assets/icon.png 
    - assets/splash_bg.png # 🔥 ADDED: So your custom Flutter widget can load the image!

# --- APP ICON CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

# --- SPLASH SCREEN CONFIGURATION (Custom Setup) ---
flutter_native_splash:
  # 🔥 Changed to solid color only to blend smoothly with your custom Flutter splash screen
  color: "#1A237E" 
  android: true
  ios: true
  android_12:
    color: "#1A237E"